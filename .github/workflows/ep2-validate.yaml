# EP2 · CI de validación en cada push/PR que toque EV2, sin credenciales ni estado:
#   - terraform fmt + validate
#   - docker build linux/arm64 de las 5 imágenes, sin publicar
#   - manifiestos de Kubernetes contra los esquemas de la API (kubeconform)
#   - shellcheck de los scripts
# Evita que llegue a main un .tf, un Dockerfile, un YAML o un script roto.

name: EP2 · Validar (terraform + docker + manifiestos + scripts)

on:
  push:
    paths: ["EV2/infra/**", "EV2/app/**", "EV2/k8s/**", "EV2/script/**", ".github/workflows/ep2-*.yaml"]
  pull_request:
    paths: ["EV2/infra/**", "EV2/app/**", "EV2/k8s/**", "EV2/script/**", ".github/workflows/ep2-*.yaml"]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - working-directory: EV2/infra/freshbox-ep2
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: docker build ${{ matrix.context }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - microservicioFrontend
          - microserviciosBackend/get-products
          - microserviciosBackend/create-product
          - microserviciosBackend/update-product
          - microserviciosBackend/delete-product
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: EV2/app/${{ matrix.context }}
          platforms: linux/arm64
          push: false

  manifiestos:
    name: kubeconform + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Mismos reemplazos que aplicar-k8s.sh, con valores de ejemplo. IngressClassParams
      # (CRD de EKS Auto Mode) no tiene esquema público: se omite.
      - name: Validar manifiestos de EV2/k8s
        run: |
          OUT="$RUNNER_TEMP/k8s"
          mkdir -p "$OUT"
          cd EV2/k8s
          find . -name '*.yaml' ! -name '*.example.yaml' | sed 's|^\./||' | while read -r f; do
            sed -e 's|<ECR_REGISTRY>|123456789012.dkr.ecr.us-east-1.amazonaws.com|g' \
                -e 's|<IMAGE_TAG>|validacion|g' \
                -e 's|<RDS_ENDPOINT>|freshbox-db.abcdefghijkl.us-east-1.rds.amazonaws.com|g' \
                -e 's|<SG_ALB_ID>|sg-0123456789abcdef0|g' "$f" > "$OUT/${f//\//-}"
          done
          kubeconform -strict -summary -ignore-missing-schemas "$OUT"
          if grep -l '<[A-Z_]*>' "$OUT"/*.yaml; then echo "Quedaron marcadores sin reemplazar"; exit 1; fi

      - name: shellcheck de los scripts
        run: shellcheck -S warning EV2/script/*.sh EV2/app/scripts/*.sh
