# ─────────────────────────────────────────────────────────────
# EP2 · Máquina de carga (demo de escalado; no forma parte de la evaluación)
# Actions → "EP2 · Máquina de carga" → Run workflow → acción:
#   crear      EC2 fuera de la VPC de FreshBox con k6 y el Cluster Autoscaler
#              (requiere el clúster de EP2 ya desplegado)
#   eliminar   borra la EC2, su SG y el acceso de LabRole al clúster
#              (funciona aunque el clúster ya no exista)
# En push y pull request que toquen EV2/carga corre solo la validación.
# Uso de la máquina: EV2/carga/README.md
# ─────────────────────────────────────────────────────────────

name: EP2 · Máquina de carga
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('EP2 · carga · {0}', inputs.accion)
      || format('EP2 · carga · validar · {0}', github.event.head_commit.message || github.event.pull_request.title) }}

on:
  push:
    paths: ["EV2/carga/**", ".github/workflows/carga-freshbox.yaml"]
  pull_request:
    paths: ["EV2/carga/**", ".github/workflows/carga-freshbox.yaml"]
  workflow_dispatch:
    inputs:
      accion:
        description: "crear · eliminar"
        required: true
        type: choice
        options: [crear, eliminar]
        default: crear

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: EV2/carga/infra
  CLUSTER: freshbox-cluster

jobs:
  validar:
    name: carga · terraform validate + shellcheck
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: shellcheck de los scripts
        run: shellcheck -S warning EV2/carga/scripts/*.sh

  carga:
    name: carga · terraform
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: freshbox-ep2-carga
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Comprobar que el clúster de EP2 existe
        if: inputs.accion == 'crear'
        run: |
          if ! STATUS="$(aws eks describe-cluster --name "$CLUSTER" --query cluster.status --output text 2>&1)"; then
            echo "$STATUS"
            echo "::error::No existe el clúster $CLUSTER: lanza antes 'EP2 · FreshBox (EKS + RDS)' con la acción desplegar."
            exit 1
          fi
          echo "Clúster $CLUSTER: $STATUS"

      # El bucket de estado y la tabla de bloqueo son los de EP2 (los crea su workflow).
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt + validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform apply
        if: inputs.accion == 'crear'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform destroy
        if: inputs.accion == 'eliminar'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -auto-approve

      - name: Resumen
        if: inputs.accion == 'crear'
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Máquina de carga creada"
            echo ""
            echo "Se prepara sola en unos 4 minutos (kubectl, k6 y Cluster Autoscaler)."
            echo ""
            echo "1. Con la sesión del lab abierta en la consola, entra a [EC2 → Connect]($(terraform output -raw conectar_url))"
            echo "2. Pestaña **Session Manager** → Connect (respaldo: **EC2 Instance Connect**) y ejecuta \`sudo -i\`"
            echo "3. Primera sesión: \`freshbox-vigilar\` · segunda sesión: \`freshbox-demo\`"
            echo ""
            echo "Al terminar: este workflow con la acción **eliminar**."
            echo ""
            echo '```'; terraform output; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
