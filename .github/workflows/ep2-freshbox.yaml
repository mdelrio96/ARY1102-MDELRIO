# ─────────────────────────────────────────────────────────────
# EP2 · FreshBox en Amazon EKS + RDS Multi-AZ (AWS Academy Learner Lab)
# Único workflow de la evaluación. Actions → "EP2 · FreshBox (EKS + RDS)" →
# Run workflow → acción:
#   desplegar        Terraform apply (con EKS) + imágenes arm64 a ECR + manifiestos
#                    en EKS + prueba CRUD por el ALB. Sirve también para actualizar todo.
#   actualizar-app   solo imágenes y manifiestos (la infraestructura ya existe)
#   infraestructura  solo Terraform apply; con crear_eks desmarcado crea o deja
#                    solo la base (red, SG, ECR y RDS) y quita el clúster si existía
#   plan             muestra qué cambiaría Terraform, sin aplicar
#   eliminar         retira el ALB del Ingress, terraform destroy y logs de Container Insights
#   validar          las mismas revisiones que corren solas en cada push/PR a EV2
# En push y pull request que toquen EV2 corre solo la validación (sin credenciales).
#
# Mismos comandos que en local: EV2/script/*.sh y terraform -chdir=EV2/infra/freshbox-ep2.
# ─────────────────────────────────────────────────────────────

name: EP2 · FreshBox (EKS + RDS)

on:
  push:
    paths: ["EV2/infra/**", "EV2/app/**", "EV2/k8s/**", "EV2/script/**", ".github/workflows/ep2-*.yaml"]
  pull_request:
    paths: ["EV2/infra/**", "EV2/app/**", "EV2/k8s/**", "EV2/script/**", ".github/workflows/ep2-*.yaml"]
  workflow_dispatch:
    inputs:
      accion:
        description: "desplegar (todo) · actualizar-app · infraestructura · plan · eliminar · validar"
        required: true
        type: choice
        options: [desplegar, actualizar-app, infraestructura, plan, eliminar, validar]
        default: desplegar
      crear_eks:
        description: "Crear el clúster EKS (solo para infraestructura y plan; desplegar siempre lo crea)"
        required: true
        type: boolean
        default: true
      image_tag:
        description: "Tag de las imágenes (vacío = commit actual)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: EV2/infra/freshbox-ep2
  APP_DIR: EV2/app

jobs:
  # ═══════════════ Validación: push, PR o acción "validar" ═══════════════

  validar-terraform:
    name: validar · terraform fmt + validate
    if: github.event_name != 'workflow_dispatch' || inputs.accion == 'validar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  validar-docker:
    name: validar · docker build ${{ matrix.context }}
    if: github.event_name != 'workflow_dispatch' || inputs.accion == 'validar'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - microservicioFrontend
          - microserviciosBackend/get-products
          - microserviciosBackend/create-product
          - microserviciosBackend/update-product
          - microserviciosBackend/delete-product
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/${{ matrix.context }}
          platforms: linux/arm64
          push: false

  validar-manifiestos:
    name: validar · kubeconform + shellcheck
    if: github.event_name != 'workflow_dispatch' || inputs.accion == 'validar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Mismos reemplazos que aplicar-k8s.sh, con valores de ejemplo. IngressClassParams
      # (CRD de EKS Auto Mode) no tiene esquema público: se omite.
      - name: Validar manifiestos de EV2/k8s
        run: |
          OUT="$RUNNER_TEMP/k8s"
          mkdir -p "$OUT"
          cd EV2/k8s
          find . -name '*.yaml' ! -name '*.example.yaml' | sed 's|^\./||' | while read -r f; do
            sed -e 's|<ECR_REGISTRY>|123456789012.dkr.ecr.us-east-1.amazonaws.com|g' \
                -e 's|<IMAGE_TAG>|validacion|g' \
                -e 's|<RDS_ENDPOINT>|freshbox-db.abcdefghijkl.us-east-1.rds.amazonaws.com|g' \
                -e 's|<SG_ALB_ID>|sg-0123456789abcdef0|g' "$f" > "$OUT/${f//\//-}"
          done
          kubeconform -strict -summary -ignore-missing-schemas "$OUT"
          if grep -l '<[A-Z_]*>' "$OUT"/*.yaml; then echo "Quedaron marcadores sin reemplazar"; exit 1; fi

      - name: shellcheck de los scripts
        run: shellcheck -S warning EV2/script/*.sh EV2/app/scripts/*.sh

  # ═══════════════ Infraestructura: desplegar, infraestructura, plan, eliminar ═══════════════

  infra:
    name: terraform ${{ inputs.accion == 'plan' && 'plan' || (inputs.accion == 'eliminar' && 'destroy' || 'apply') }}${{ inputs.accion != 'eliminar' && ((inputs.accion == 'desplegar' || inputs.crear_eks) && ' (con EKS)' || ' (sin EKS)') || '' }}
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["desplegar","infraestructura","plan","eliminar"]'), inputs.accion)
    runs-on: ubuntu-latest
    timeout-minutes: 75 # EKS ~12 min, node group ~5, RDS Multi-AZ ~15-20 (en paralelo)
    # Nunca dos operaciones sobre el mismo estado a la vez.
    concurrency:
      group: freshbox-ep2-terraform
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_aws_region: us-east-1
      TF_VAR_create_eks: ${{ inputs.accion == 'desplegar' || inputs.crear_eks }}
      # Solo si el clúster va a desaparecer: eliminar, o infraestructura sin crear_eks.
      QUITA_EKS: ${{ inputs.accion == 'eliminar' || (inputs.accion == 'infraestructura' && !inputs.crear_eks) }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Bucket de estado + tabla de bloqueo (idempotente), antes de que Terraform
      # toque la cuenta. Son los mismos de EV1.
      - name: Backend de estado (S3 + DynamoDB si no existen)
        run: bash EV2/script/bootstrap-tfstate.sh

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt + validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      # El ALB del Ingress no es de Terraform: sin su controlador quedaría huérfano
      # y bloquearía la VPC. bajar-k8s.sh no hace nada si el clúster no existe.
      - name: Instalar kubectl
        if: env.QUITA_EKS == 'true'
        uses: azure/setup-kubectl@v4

      - name: Retirar el ALB del Ingress y los pods
        if: env.QUITA_EKS == 'true'
        run: bash EV2/script/bajar-k8s.sh

      - name: Terraform plan
        if: inputs.accion == 'plan'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -no-color | tee plan.txt
          { echo "### terraform plan"; echo '```'; tail -n 250 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: inputs.accion == 'desplegar' || inputs.accion == 'infraestructura'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform destroy
        if: inputs.accion == 'eliminar'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -auto-approve

      # Container Insights crea sus grupos de logs desde el clúster (fuera de Terraform).
      - name: Borrar logs de Container Insights
        if: inputs.accion == 'eliminar'
        run: |
          for LG in $(aws logs describe-log-groups --log-group-name-prefix /aws/containerinsights/freshbox-cluster \
                        --query 'logGroups[].logGroupName' --output text); do
            echo "Borrando $LG"
            aws logs delete-log-group --log-group-name "$LG"
          done

      - name: Resumen
        if: inputs.accion == 'desplegar' || inputs.accion == 'infraestructura'
        working-directory: ${{ env.TF_DIR }}
        run: |
          RDS="$(terraform output -raw rds_identifier)"
          {
            echo "### EP2 — Infraestructura lista"
            echo ""
            if [ "$(terraform output -raw eks_enabled)" = "true" ]; then
              echo "Clúster EKS \`$(terraform output -raw cluster_name)\` y RDS \`$RDS\` (Multi-AZ)."
            else
              echo "Base lista (red, SG, ECR y RDS \`$RDS\` Multi-AZ), **sin clúster EKS**."
              echo "Para agregarlo: acción *infraestructura* con *crear_eks* marcado, o *desplegar*."
            fi
            echo ""
            echo '```'; terraform output; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════ Aplicación: desplegar, actualizar-app ═══════════════

  tag:
    name: app · tag de las imágenes
    if: github.event_name == 'workflow_dispatch' && (inputs.accion == 'desplegar' || inputs.accion == 'actualizar-app')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

  # En "desplegar" espera a la infraestructura; en "actualizar-app" el job infra se
  # omite y la construcción parte de inmediato.
  build:
    name: app · build+push ${{ matrix.service }}
    needs: [infra, tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' && (needs.infra.result == 'success' || needs.infra.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: microservicioFrontend
          - service: get-products
            context: microserviciosBackend/get-products
          - service: create-product
            context: microserviciosBackend/create-product
          - service: update-product
            context: microserviciosBackend/update-product
          - service: delete-product
            context: microserviciosBackend/delete-product

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU permite construir arm64 en el runner x86_64.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/${{ matrix.context }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ needs.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/freshbox-${{ matrix.service }}:latest
          cache-from: type=gha,scope=ep2-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ep2-${{ matrix.service }}

      - name: Resumen
        run: echo "- \`freshbox-${{ matrix.service }}\` → \`${{ needs.tag.outputs.tag }}\`, \`latest\` (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: app · manifiestos en EKS + prueba CRUD
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      # Solo para leer las salidas (endpoint de RDS, clave, SG-ALB); no cambia nada.
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Aplicar manifiestos en EKS
        id: k8s
        run: bash EV2/script/aplicar-k8s.sh

      - name: Prueba CRUD por el ALB
        shell: bash # -o pipefail: si falla la prueba, falla el paso aunque pase por tee
        run: bash EV2/script/probar-crud.sh "${{ steps.k8s.outputs.alb_url }}" | tee crud.txt

      - name: Resumen
        run: |
          {
            echo "## FreshBox en EKS"
            echo "- Frontend: ${{ steps.k8s.outputs.alb_url }}"
            echo "- API: ${{ steps.k8s.outputs.alb_url }}/api/products"
            echo "- Imágenes: \`freshbox-*:$IMAGE_TAG\`"
            echo ""
            echo '```'
            kubectl get nodes -o wide
            kubectl get pods,hpa,ingress -n freshbox
            echo '```'
            echo "### Prueba CRUD"
            echo '```'; cat crud.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
