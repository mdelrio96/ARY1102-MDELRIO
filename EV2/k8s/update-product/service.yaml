# Service ClusterIP de update-product (PUT). Solo accesible dentro del clúster:
# Nginx lo llama como update-product.freshbox.svc.cluster.local:3003.
apiVersion: v1
kind: Service
metadata:
  name: update-product
  namespace: freshbox
  labels:
    app: update-product
spec:
  type: ClusterIP
  selector:
    app: update-product
  ports:
    - name: http
      port: 3003
      targetPort: http
