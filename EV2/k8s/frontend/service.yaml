# Service ClusterIP del frontend: destino del Ingress (el ALB envía a las IP de
# estos pods, target-type ip). No se expone fuera del clúster por sí mismo.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: freshbox
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
