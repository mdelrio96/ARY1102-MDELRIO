# Solo referencia de forma: no se aplica ni se versiona con la clave real.
# script/aplicar-k8s.sh crea el Secret freshbox-secret con la clave aleatoria
# que generó Terraform para RDS (salida db_password), sin escribirla en Git ni
# en los argumentos de kubectl. Un Secret en base64 no es cifrado: el control
# está en quién puede leerlo en el clúster.
apiVersion: v1
kind: Secret
metadata:
  name: freshbox-secret
  namespace: freshbox
type: Opaque
stringData:
  DB_USER: "alumno"
  DB_PASS: "<DB_PASS>"
