# Service ClusterIP de create-product (POST). Solo accesible dentro del clúster:
# Nginx lo llama como create-product.freshbox.svc.cluster.local:3002.
apiVersion: v1
kind: Service
metadata:
  name: create-product
  namespace: freshbox
  labels:
    app: create-product
spec:
  type: ClusterIP
  selector:
    app: create-product
  ports:
    - name: http
      port: 3002
      targetPort: http
