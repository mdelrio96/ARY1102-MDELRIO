# Esquema y datos iniciales en RDS: carga app/init.sql (tablas productos y ordenes,
# con IF NOT EXISTS) desde dentro del clúster, porque RDS esta en una subred privada.
# Luego carga app/datos-iniciales.sql solo si la tabla productos esta vacia.
# El ConfigMap freshbox-init-sql lo crea script/aplicar-k8s.sh con los dos archivos.
# La clave va en MYSQL_PWD para que no aparezca en los argumentos del proceso.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrar-datos-ep3
  namespace: freshbox
  labels:
    app: migrar-datos-ep3
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrar-datos-ep3
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-client
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h "$DB_HOST" -u "$DB_USER" < /sql/init.sql
              echo "Esquema aplicado en $DB_HOST"
              FILAS=`mysql -h "$DB_HOST" -u "$DB_USER" -N -e "SELECT COUNT(*) FROM productos" "$DB_NAME" 2>/dev/null || echo 0`
              if [ "${FILAS:-0}" -gt 0 ]; then
                echo "La tabla productos ya tiene $FILAS filas: no se cargan los datos iniciales"
              else
                mysql -h "$DB_HOST" -u "$DB_USER" < /sql/datos-iniciales.sql
                echo "Datos iniciales cargados"
              fi
              mysql -h "$DB_HOST" -u "$DB_USER" -e "SELECT COUNT(*) AS productos FROM productos; SELECT COUNT(*) AS ordenes FROM ordenes" "$DB_NAME"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: freshbox-config, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: freshbox-config, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: freshbox-secret, key: DB_USER }
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef: { name: freshbox-secret, key: DB_PASS }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: freshbox-init-sql
