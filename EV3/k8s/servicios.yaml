# Los 4 microservicios CRUD de productos (EP3): Deployment + Service + HPA por servicio.
# GET /api/products (get-products), POST (create-product), PUT (update-product) y
# DELETE (delete-product). <ECR_REGISTRY> e <IMAGE_TAG> los reemplaza aplicar-k8s.sh.
# Cada Deployment: 2 replicas repartidas entre AZ1a y AZ1b; el HPA las lleva a 5
# con CPU objetivo 70 % (metrics-server). Sin frontend: el sitio vive en S3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-products
  namespace: freshbox
  labels:
    app: get-products
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: get-products
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: get-products
        tier: backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: get-products
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: get-products
          image: <ECR_REGISTRY>/freshbox-get-products:<IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: freshbox-config, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: freshbox-config, key: DB_NAME }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: freshbox-config, key: DB_PORT }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: freshbox-secret, key: DB_USER }
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: freshbox-secret, key: DB_PASS }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: get-products
  namespace: freshbox
  labels:
    app: get-products
spec:
  type: ClusterIP
  selector:
    app: get-products
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: get-products-hpa
  namespace: freshbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: get-products
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
