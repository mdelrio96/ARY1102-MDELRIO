# Ingress Controller: el ALB lo administra EKS Auto Mode (controlador
# eks.amazonaws.com/alb). Requisito: clúster con compute_config, elastic_load_balancing
# y block_storage habilitados (EV3/infra/freshbox-ep3/eks.tf). Mismo mecanismo que EV2.
# Auto Mode crea el ALB en las subredes etiquetadas kubernetes.io/role/elb=1.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: freshbox-alb
spec:
  scheme: internet-facing
  targetType: ip
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: freshbox-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: freshbox-alb
